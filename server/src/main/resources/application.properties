spring.application.name=video-game-letterbox

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/video_game_letterbox}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

rawg.api.base-url=https://api.rawg.io/api
rawg.api.key=${RAWG_API_KEY:}

jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=15

