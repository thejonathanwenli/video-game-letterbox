spring.application.name=video-game-letterbox

spring.datasource.url=${VGL_DB_URL:jdbc:mysql://localhost:3306/video_game_letterbox}
spring.datasource.username=${VGL_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${VGL_DB_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

igdb.api.base-url=https://api.igdb.com/v4
igdb.auth.base-url=https://id.twitch.tv/oauth2
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}

jwt.secret=${JWT_SECRET:}
jwt.issuer=video-game-letterbox
jwt.expiration-minutes=60

