name: video-game-letterbox-aws

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting the AWS deployment}
      MYSQL_DATABASE: video_game_letterbox
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME before starting the AWS deployment}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the AWS deployment}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/database/schema-prod.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  video-game-letterbox-backend:
    build: ./server
    environment:
      VGL_DB_URL: jdbc:mysql://mysql:3306/video_game_letterbox
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME before starting the AWS deployment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the AWS deployment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the AWS deployment}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:?Set IGDB_CLIENT_ID before starting the AWS deployment}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:?Set IGDB_CLIENT_SECRET before starting the AWS deployment}
      VGL_PUBLIC_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN before starting the AWS deployment}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./client
    depends_on:
      - video-game-letterbox-backend
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN before starting the AWS deployment}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/aws/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
